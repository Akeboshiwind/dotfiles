schemaVersion: "2"
kind: mixin
name: osm-clojure
displayName: Clojure toolchain
description: babashka, the Clojure CLI and clj-kondo.

# No JDK: the image ships one, and babashka and the Clojure CLI run on whatever
# it is. A build that pins a version wants a JDK kit stacked alongside.
#
# JAVA_TOOL_OPTIONS arrives preset with the sandbox proxy, so Maven Central and
# Clojars resolve once allowed here.
permissions:
  network:
    allow:
      - clojars.org
      - repo.clojars.org
      - repo1.maven.org
      - download.clojure.org
      - github.com
      - raw.githubusercontent.com
      - objects.githubusercontent.com

setup:
  # Guarded so a re-run is a no-op. Each tool is its own entry: a failure then
  # names the tool that broke rather than the whole toolchain.
  install:
    - command: command -v bb >/dev/null || curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install | bash
      description: babashka
    - command: command -v clj-kondo >/dev/null || curl -sL https://raw.githubusercontent.com/clj-kondo/clj-kondo/master/script/install-clj-kondo | bash
      description: clj-kondo
    - command: command -v clojure >/dev/null || (cd /tmp && curl -sL -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh && bash linux-install.sh)
      description: Clojure CLI
    # A bb.edn with :deps sends babashka through deps.clj, which ignores the CLI
    # installed above and fetches its own pinned clojure-tools.zip from github —
    # where the proxy terminates TLS to inject credentials. bb is a native image
    # carrying its own truststore, so it cannot be taught the proxy CA the way a
    # JVM can, and the download dies on PKIX. Pointing deps.clj at the jar we
    # already have removes the download instead of trying to fix its TLS.
    #
    # Both vars are needed: DEPS_CLJ_TOOLS_DIR alone still looks for the version
    # deps.clj pins, which is not the one `latest` just installed.
    - command: |
        set -eu
        grep -q DEPS_CLJ_TOOLS_DIR /etc/sandbox-persistent.sh || {
          v=$(clojure --version | grep -oE '[0-9]+(\.[0-9]+){3}')
          echo "export DEPS_CLJ_TOOLS_DIR=/usr/local/lib/clojure/libexec"
          echo "export DEPS_CLJ_TOOLS_VERSION=$v"
        } >> /etc/sandbox-persistent.sh
      description: Let bb reuse the installed Clojure tools
    # As the agent, not root: bbin installs into $HOME/.local/bin, which is
    # already on PATH, and root's copy would be invisible to everything.
    - command: |
        set -eu
        command -v bbin >/dev/null || {
          mkdir -p "$HOME/.local/bin"
          curl -sL https://raw.githubusercontent.com/babashka/bbin/v0.2.4/bbin -o "$HOME/.local/bin/bbin"
          chmod +x "$HOME/.local/bin/bbin"
        }
      user: "1000"
      description: bbin
    # Sourced, not assumed: bbin resolves its own deps through deps.clj, which
    # cannot fetch clojure-tools here. The entry above wrote the vars that avoid
    # that download, and an install step does not inherit them.
    - command: |
        set -eu
        . /etc/sandbox-persistent.sh
        command -v clj-nrepl-eval >/dev/null || \
          "$HOME/.local/bin/bbin" install https://github.com/bhauman/clojure-mcp-light.git \
            --git/tag v0.2.0 \
            --main-opts '["-m" "clojure-mcp-light.nrepl-eval"]' \
            --as clj-nrepl-eval
      user: "1000"
      description: clj-nrepl-eval

agentInstructions:
  content: |
    ## Clojure

    `bb`, `clojure`, `clj-kondo` and `clj-nrepl-eval` are installed. They run on
    whichever JDK the image or a stacked JDK kit provides; this kit does not
    manage one.

    The host editor's REPL is not reachable. Start your own — `bb nrepl`, or
    `clojure -M:nrepl` — then evaluate against it:

        clj-nrepl-eval --discover-ports
        clj-nrepl-eval -p 1339 "(+ 1 2 3)"

    Session state persists between calls, so a namespace required in one
    evaluation is still there in the next. Prefer this to `bb -e`, which starts
    a fresh process each time and cannot see the state you just built up.
