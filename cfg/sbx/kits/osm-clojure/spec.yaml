schemaVersion: "2"
kind: mixin
name: osm-clojure
displayName: Clojure toolchain
description: babashka, the Clojure CLI and clj-kondo. The agent image already ships a JDK.

# The image has OpenJDK 25 at /usr/bin/java and presets JAVA_TOOL_OPTIONS with the
# sandbox proxy, so Maven Central and Clojars resolve once allowed here. That JDK
# is fine for babashka work, which is most of it.
#
# It is not fine for a JVM build: cfg/clojure pins temurin 21, and Gradle 8.x
# cannot run on 25 at all. Stack osm-java alongside this kit for those repos:
#   --kit ~/.config/sbx/kits/osm-java
permissions:
  network:
    allow:
      - clojars.org
      - repo.clojars.org
      - repo1.maven.org
      - download.clojure.org
      - github.com
      - raw.githubusercontent.com
      - objects.githubusercontent.com

setup:
  # Guarded so a re-run is a no-op. Each tool is its own entry: a failure then
  # names the tool that broke rather than the whole toolchain.
  install:
    - command: command -v bb >/dev/null || curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install | bash
      description: babashka
    - command: command -v clj-kondo >/dev/null || curl -sL https://raw.githubusercontent.com/clj-kondo/clj-kondo/master/script/install-clj-kondo | bash
      description: clj-kondo
    - command: command -v clojure >/dev/null || (cd /tmp && curl -sL -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh && bash linux-install.sh)
      description: Clojure CLI
    # A bb.edn with :deps sends babashka through deps.clj, which ignores the CLI
    # installed above and fetches its own pinned clojure-tools.zip from github —
    # where the proxy terminates TLS to inject credentials. bb is a native image
    # carrying its own truststore, so it cannot be taught the proxy CA the way a
    # JVM can, and the download dies on PKIX. Pointing deps.clj at the jar we
    # already have removes the download instead of trying to fix its TLS.
    #
    # Both vars are needed: DEPS_CLJ_TOOLS_DIR alone still looks for the version
    # deps.clj pins, which is not the one `latest` just installed.
    - command: |
        set -eu
        grep -q DEPS_CLJ_TOOLS_DIR /etc/sandbox-persistent.sh || {
          v=$(clojure --version | grep -oE '[0-9]+(\.[0-9]+){3}')
          echo "export DEPS_CLJ_TOOLS_DIR=/usr/local/lib/clojure/libexec"
          echo "export DEPS_CLJ_TOOLS_VERSION=$v"
        } >> /etc/sandbox-persistent.sh
      description: Let bb reuse the installed Clojure tools

agentInstructions:
  content: |
    ## Clojure

    `bb`, `clojure` and `clj-kondo` are installed. The JDK is OpenJDK 25, which
    is newer than the temurin 21 this project is developed against on the host.

    There is no shared nREPL here. The host editor's REPL is not reachable, and
    one started in here is reachable only from inside the sandbox. Evaluate with
    `bb -e` or `clojure -M -e` rather than looking for a running nREPL to join.
